<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование</title>
    <link rel="stylesheet" href="styles/pages.css">
</head>
<body>
    <!-- Меню -->
    <nav class="menu">
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="flights.html">Рейсы</a></li>
            <li><a href="booking.html" class="active">Бронирование</a></li>
            <li><a href="contacts.html">Контакты</a></li>
        </ul>
    </nav>

    <header>
        <h1>Бронирование билетов</h1>
    </header>

    <main>
        <form class="booking-form">
            <fieldset>
                <legend>Информация пассажира</legend>
                
                <div class="form-group">
                    <label for="name">ФИО:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Телефон:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Параметры рейса</legend>
                
                <div class="form-group">
                    <label for="from">Откуда:</label>
                    <select id="from" name="from" required>
                        <option>Москва</option>
                        <option>СПб</option>
                        <option>Казань</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="to">Куда:</label>
                    <select id="to" name="to" required>
                        <option>Париж</option>
                        <option>Лондон</option>
                        <option>Берлин</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Дата вылета:</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="passengers">Количество пассажиров:</label>
                    <input type="number" id="passengers" name="passengers" min="1" max="9" value="1" required>
                </div>
            </fieldset>

            <button type="submit" class="btn-submit">Забронировать</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Аэропорт. Все права защищены.</p>
    </footer>
</body>
</html>
